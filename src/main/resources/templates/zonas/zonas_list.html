<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Zonas</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f4f7f9; }
        h1 { color: #007bff; border-bottom: 3px solid #007bff; padding-bottom: 10px; margin-bottom: 25px; }
        .message-box { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 10px; margin-bottom: 20px; border-radius: 5px; }
        .error-box { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 10px; margin-bottom: 20px; border-radius: 5px; font-weight: bold; }
        table { width: 50%; border-collapse: collapse; background-color: #fff; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid #e0e0e0; padding: 12px 15px; text-align: left; }
        th { background-color: #007bff; color: white; font-weight: 600; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        a { color: #28a745; text-decoration: none; margin-right: 10px; }
        .btn-new { display: inline-block; padding: 10px 15px; background-color: #dc3545; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
<div th:if="${message}" th:text="${message}" class="message-box"></div>
<div th:if="${error}" th:text="${error}" class="error-box"></div>

<h1>Gerenciamento de Zonas de Estacionamento</h1>

<p style="color:#dc3545;">* Criação de novas zonas não é permitida. Apenas edição de infraestrutura existente.</p>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Nome da Zona</th>
        <th>Tipo</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="zona : ${listaZonas}">
        <td th:text="${zona.id}"></td>
        <td th:text="${zona.nome}"></td>
        <td th:text="${zona.tipo}"></td>
        <td>
            <a th:href="@{'/zonas/edit/' + ${zona.id}}">Editar</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
