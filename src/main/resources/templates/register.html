<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Heimdall</title>
    <style th:replace="~{fragments/menu :: menu-css}"></style>
    <style>
        /* Estilos específicos centralizados (igual ao login) */
        body {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background-color: var(--bg-main);
        }
        .register-container {
            background-color: var(--bg-panel); padding: 40px; border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); width: 100%; max-width: 450px;
            border: 1px solid var(--border-color);
        }
        .register-title {
            color: var(--primary); text-align: center; margin-bottom: 30px;
            font-size: 1.8em; font-weight: 800; letter-spacing: 1px;
        }
        /* Sobrescreve o estilo de form global para este container específico */
        .register-container form {
            max-width: 100%; background: none; padding: 0; border: none; box-shadow: none;
        }
        .login-link { text-align: center; display: block; margin-top: 20px; color: var(--secondary); }
        .login-link a { color: var(--accent); }
    </style>
</head>
<body>
<div class="register-container">
    <div class="register-title">CRIAR CONTA</div>

    <div th:if="${param.error}" class="error-box">Erro ao registrar. Verifique os dados.</div>
    <div th:if="${error}" th:text="${error}" class="error-box"></div>

    <form th:action="@{/register}" th:object="${user}" method="post">

        <label for="name">Nome:</label>
        <input type="text" id="name" th:field="*{name}" required />

        <label for="middleName">Sobrenome:</label>
        <input type="text" id="middleName" th:field="*{middleName}" required />

        <label for="email">Email (Login):</label>
        <input type="email" id="email" th:field="*{email}" required />

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" th:field="*{cpf}" required maxlength="14" />

        <label for="password">Senha:</label>
        <input type="password" id="password" th:field="*{password}" required />

        <label for="birthday">Data de Nascimento:</label>
        <input type="date" id="birthday" th:field="*{birthday}" required />

        <button type="submit" style="margin-top: 30px;">REGISTRAR</button>
    </form>

    <span class="login-link">
            Já tem uma conta? <a th:href="@{/login}">Faça Login</a>
        </span>
</div>
</body>
</html>
