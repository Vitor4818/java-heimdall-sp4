<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (title=${pageTitle}, content=~{::#conteudo})}">
<head></head>
<body>
<div id="conteudo">

    <h1 th:text="${pageTitle}"></h1>

    <div th:if="${error}" th:text="${error}" class="error-box"></div>

    <form th:action="@{/users/save}" th:object="${user}" method="post">

        <input type="hidden" th:field="*{id}" />

        <label for="name">Nome:</label>
        <input type="text" id="name" th:field="*{name}" required />

        <label for="middleName">Sobrenome:</label>
        <input type="text" id="middleName" th:field="*{middleName}" required />

        <label for="userCategory">Categoria de Usuário:</label>
        <select id="userCategory" th:field="*{userCategory}" required>
            <option value="">-- Selecione --</option>
            <option th:each="cat : ${allCategories}"
                    th:value="${cat.id}"
                    th:text="${cat.category}"
                    th:selected="${user.userCategory != null and user.userCategory.id == cat.id}">
            </option>
        </select>

        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" required />

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" th:field="*{cpf}" required maxlength="14" placeholder="000.000.000-00" />

        <div th:if="*{id == null}">
            <label for="password">Senha:</label>
            <input type="password" id="password" th:field="*{password}" required />
        </div>

        <button type="submit">Salvar Usuário</button>
    </form>

    <a th:href="@{/users}" class="back-link">← Voltar para a lista</a>

</div>
</body>
</html>
