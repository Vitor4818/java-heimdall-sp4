<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (title=${pageTitle}, content=~{::#conteudo})}">
<head></head>
<body>
<div id="conteudo">

    <h1 th:text="${pageTitle}"></h1>

    <div th:if="${error}" th:text="${error}" class="error-box"></div>

    <div class="detail-container" style="background-color: var(--bg-panel); padding: 35px; border-radius: 12px; border: 1px solid var(--border-light); max-width: 550px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border-top: 4px solid var(--primary);">

        <div class="detail-item" th:object="${user}">
            <label style="margin-top: 0;">ID:</label>
            <p class="detail-value" th:text="*{id}" style="font-size: 1.1em; margin-bottom: 15px;"></p>

            <label>Categoria (Permissão):</label>
            <p class="detail-value" th:if="*{userCategory != null}"
               th:text="*{userCategory.category}"
               style="font-size: 1.1em; margin-bottom: 15px; color: var(--warning); font-weight: bold;">
            </p>

            <label>Nome Completo:</label>
            <p class="detail-value" th:text="*{name} + ' ' + *{middleName}" style="font-size: 1.1em; margin-bottom: 15px;"></p>

            <label>Email:</label>
            <p class="detail-value" th:text="*{email}" style="font-size: 1.1em; margin-bottom: 15px;"></p>

            <label>CPF:</label>
            <p class="detail-value" th:text="*{cpf}" style="font-size: 1.1em; margin-bottom: 15px;"></p>

            <div th:if="*{birthday != null}">
                <label>Data de Nascimento:</label>
                <p class="detail-value" th:text="*{#temporals.format(birthday, 'dd/MM/yyyy')}" style="font-size: 1.1em; margin-bottom: 15px;"></p>
            </div>
        </div>

        <a th:href="@{'/users/edit/' + ${user.id}}" class="btn" style="width: 100%; display: block; text-align: center; margin-top: 30px;">Editar Usuário</a>
    </div>

    <a href="/users" class="back-link">Voltar para a lista</a>

</div>
</body>
</html>
